# Checked on every pull request and every push to main.
#
# Three things that have each broken the app before they were noticed:
#   - types and lint, so a mistake in a screen is caught before a build;
#   - generating the Android project, which is where an invalid app.json or a
#     misnamed asset fails (an order sound with a hyphen in its name stopped
#     every Android build, and nothing complained until someone built it).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: bash scripts/typecheck.sh

      - name: Lint (no new errors)
        run: bash scripts/lint-ratchet.sh

      - name: The Android project generates
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
